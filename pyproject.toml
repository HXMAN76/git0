[project]
name = "membranch"
version = "0.1.0"
description = "Git for agent memory: per-agent memory branches merged by meaning, stored in FalkorDB."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "falkordb>=1.8.0",
    "fastapi>=0.135",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "groq>=0.30",
    "google-genai>=1.0",
    "mcp>=2.3",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.0",
    "httpx>=0.27",
    "ruff>=0.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/membranch"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "llm: calls a real LLM API (skipped unless GROQ_API_KEY is set)",
]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["docs", "web"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
