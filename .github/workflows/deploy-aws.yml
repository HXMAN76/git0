name: deploy-aws

# Deploys main to the EC2 host (Caddy HTTPS + api + FalkorDB) after CI passes (ADR 0006).
# Ships compose.yaml, Caddyfile and host-deploy.sh with every rollout, so the host always matches the repo.
# Keyless: GitHub OIDC -> IAM role (trust limited to this repo on refs/heads/main).
# Inert until `deploy/aws/setup.sh github` has set the AWS_* repo variables.

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-aws
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      vars.AWS_DEPLOY_ROLE_ARN != '' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - name: build + push
        run: |
          docker build -t "${{ vars.AWS_ECR_URI }}:$SHA" .
          docker push "${{ vars.AWS_ECR_URI }}:$SHA"
      - name: roll out on the host via SSM Run Command
        run: |
          b64() { base64 -w0 "deploy/aws/$1"; }
          jq -n --arg compose "$(b64 compose.prod.yaml)" --arg caddy "$(b64 Caddyfile)" \
                --arg deploy "$(b64 host-deploy.sh)" --arg image "${{ vars.AWS_ECR_URI }}:$SHA" '{commands: [
            "set -euo pipefail",
            "mkdir -p /opt/membranch /var/lib/membranch/falkordb",
            "echo \($compose) | base64 -d > /opt/membranch/compose.yaml",
            "echo \($caddy) | base64 -d > /opt/membranch/Caddyfile",
            "echo \($deploy) | base64 -d > /opt/membranch/host-deploy.sh",
            "chmod +x /opt/membranch/host-deploy.sh",
            "ln -sf /opt/membranch/host-deploy.sh /usr/local/bin/membranch-deploy",
            "/opt/membranch/host-deploy.sh \($image)"
          ], executionTimeout: ["900"]}' > ssm-params.json
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.AWS_INSTANCE_ID }}" \
            --document-name AWS-RunShellScript \
            --comment "membranch deploy $SHA" \
            --parameters file://ssm-params.json \
            --query Command.CommandId --output text)
          echo "command $CMD_ID"
          for i in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" \
              --instance-id "${{ vars.AWS_INSTANCE_ID }}" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Success) break ;;
              Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 5
          done
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "${{ vars.AWS_INSTANCE_ID }}" \
            --query '[StandardOutputContent,StandardErrorContent]' --output text
          [ "$STATUS" = "Success" ]
      - name: smoke test over HTTPS (first deploy waits for the certificate)
        run: curl -fsS --retry 12 --retry-delay 10 --retry-all-errors "${{ vars.PUBLIC_URL }}/api/health"
