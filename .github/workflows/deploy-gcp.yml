name: deploy-gcp

# Deploys main to Cloud Run after CI passes (ADR 0005). Keyless: GitHub OIDC -> Workload Identity Federation.
# Inert until `deploy/gcp/setup.sh github` has set the GCP_* repo variables.
# Runtime config (VPC egress, secrets, min instances) lives on the service; this only swaps the image.

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      vars.GCP_PROJECT_ID != '' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/membranch/api
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
          token_format: access_token
      - uses: docker/login-action@v3
        with:
          registry: ${{ vars.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - name: build + push
        run: |
          docker build -t "$IMAGE:$SHA" .
          docker push "$IMAGE:$SHA"
      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ vars.GCP_SERVICE }}
          region: ${{ vars.GCP_REGION }}
          image: ${{ env.IMAGE }}:${{ env.SHA }}
      - name: smoke test
        run: |
          curl -fsS "${{ steps.deploy.outputs.url }}/api/health"
          echo "deployed ${{ steps.deploy.outputs.url }}"
